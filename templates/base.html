<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Dynasty Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a class="site-brand" href="{{ url_for('home') }}">This Is Never Going To Work</a>
            {% if current_week %}
            <span class="current-week-badge">Week {{ current_week }} in progress</span>
            {% endif %}
            <div class="site-nav-links">
                <a href="https://docs.google.com/document/d/1KgUXgfbAu_HS8g-gyoAOuM61vUQfypMwJbk64DlRxY8/edit" target="_blank" rel="noopener">Bylaws</a>
                <a class="is-coming-soon" href="{{ url_for('history') }}">League History</a>
                <a class="is-coming-soon" href="{{ url_for('draft_picks') }}">2027 Draft Picks</a>
                <a class="is-coming-soon" href="{{ url_for('power_rankings') }}">Power Rankings</a>
            </div>
        </nav>
    </header>
    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
